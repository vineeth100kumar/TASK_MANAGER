<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sage" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Matches --ground in both themes, so the status bar never disagrees with the app -->
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />

    <title>Sage</title>

    <!--
      No web fonts. The system face (SF on Apple, Roboto on Android, Segoe on Windows)
      is already on the device: nothing to download, nothing to block first paint, and
      nothing that breaks when the Pi is off the internet.
    -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
    </style>

    <!-- Resolve the theme before first paint so the app never flashes the wrong ground -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sage_theme');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', saved === 'dark');
          document.documentElement.style.backgroundColor = saved === 'dark' ? '#0e0f12' : '#f6f6f8';
        } catch (e) {
          /* private mode or blocked storage — fall through to the light default */
        }
      })();
    </script>

    <link rel="modulepreload" crossorigin href="/assets/react-BsOvDYUW.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BIdoXL1P.css">
  </head>
  <body class="antialiased">
    <div id="root"></div>
  </body>
</html>
