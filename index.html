<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sage" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>Sage</title>
  </head>
  <body>
    <!-- First-paint splash: shown instantly (before the app's JS parses) so the
         window is never a white flash between login and the app. React replaces
         it with the full morphing loader the moment it mounts; the background
         and layout match, so the handover is invisible. -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #ffffff; color: #111827; z-index: 300; }
      html.boot-dark #boot { background: #0a0a0b; color: #f3f4f6; }
      #boot svg { width: 84px; height: 84px; overflow: visible; transform-origin: 50% 50%; }
      #boot path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
      #boot .bar { margin-top: 26px; width: 92px; height: 4px; border-radius: 999px; background: rgba(0,0,0,0.08); overflow: hidden; }
      html.boot-dark #boot .bar { background: rgba(255,255,255,0.10); }
      #boot .bar i { display: block; width: 45%; height: 100%; border-radius: 999px; background: #111827; animation: boot-slide 1.1s ease-in-out infinite; }
      html.boot-dark #boot .bar i { background: #ffffff; }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; } }
    </style>
    <script>try { if (localStorage.getItem('sage-theme') === 'dark') document.documentElement.classList.add('boot-dark'); } catch (e) {}</script>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Sage">
        <svg id="boot-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g id="boot-glyph"></g></svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <!-- The same morph the login page runs, so sign-in flows straight into the
         app with one continuous animation. React replaces #root (and this) the
         moment it mounts; the loop stops itself when its node is gone. -->
    <script>
      (function () {
        var ICONS = [
          ['M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z','M8.5 12.5l2.5 2.5 5-5.5'],
          ['M9 7h11','M9 12h11','M9 17h11','M4 7h.01','M4 12h.01','M4 17h.01'],
          ['M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z','M4 10h16','M8 3v4','M16 3v4'],
          ['M6 3h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z','M14 3v4h4','M8 12h7','M8 16h5'],
          ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z','M12 11.5a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1z'],
          ['M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.2-1 2.5H9c0-1.3-.3-1.8-1-2.5A6 6 0 0 1 12 3z','M9.5 19h5','M10.5 21.5h3'],
          ['M20 7a8 8 0 1 0 1.5 6','M20 3v4h-4']
        ];
        var HOLD = 650, DRAW = 460, OUT = 240, NS = 'http://www.w3.org/2000/svg';
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var idx = 0;
        function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function alive() { return document.getElementById('boot-glyph'); }
        function setPaths(ps) {
          var g = alive(); if (!g) return [];
          g.textContent = '';
          return ps.map(function (d, k) {
            var p = document.createElementNS(NS, 'path');
            p.setAttribute('d', d); p.setAttribute('pathLength', '1');
            p.style.strokeDashoffset = '1'; p.style.opacity = '0';
            p.style.transition = reduce ? 'none' : ('stroke-dashoffset ' + DRAW + 'ms ease ' + (k * 55) + 'ms, opacity 200ms ' + (k * 55) + 'ms');
            g.appendChild(p); return p;
          });
        }
        (async function loop() {
          while (alive()) {
            var s = document.getElementById('boot-svg');
            if (!reduce) { s.style.transition = 'none'; s.style.transform = 'rotate(-5deg) scale(.92)'; }
            var nodes = setPaths(ICONS[idx]);
            await wait(20);
            if (!alive()) break;
            if (!reduce) s.style.transition = 'transform ' + DRAW + 'ms cubic-bezier(.16,1,.3,1)';
            s.style.transform = 'rotate(0deg) scale(1)';
            nodes.forEach(function (p) { p.style.strokeDashoffset = '0'; p.style.opacity = '1'; });
            await wait(reduce ? 1200 : HOLD + DRAW);
            if (!alive()) break;
            if (!reduce) {
              nodes.forEach(function (p) { p.style.strokeDashoffset = '1'; p.style.opacity = '0'; });
              s.style.transform = 'rotate(5deg) scale(.92)';
              await wait(OUT);
            }
            idx = (idx + 1) % ICONS.length;
          }
        })();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
