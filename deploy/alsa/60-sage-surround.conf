# Sage's virtual surround on the soundbar (raspberry_pi/audio/sage_surround.c).
# Installed by deploy/install_pi.sh (--only audio) into /etc/alsa/conf.d/.
# speaker.py plays through it when Surround is on in Settings > Bluetooth:
#   aplay -D sage_surround:DEV=<soundbar>,WIDTH=0.7,SPACE=0.55,DIALOG=5,BASS=4,AIR=2,PUNCH=0.6 file.wav
# Chain: any format -> float -> sage_surround (LADSPA) -> bluez-alsa (A2DP).
pcm.sage_surround {
	@args [ DEV WIDTH SPACE DIALOG BASS AIR PUNCH ]
	@args.DEV { type string default "00:00:00:00:00:00" }
	@args.WIDTH { type real default 0.6 }
	@args.SPACE { type real default 0.4 }
	@args.DIALOG { type real default 3 }
	@args.BASS { type real default 3 }
	@args.AIR { type real default 0 }
	@args.PUNCH { type real default 0 }
	type plug
	slave.pcm {
		type ladspa
		path "/usr/local/lib/sage/ladspa"
		channels 2
		plugins [
			{
				label sage_surround
				policy none
				input.bindings.0 "Input L"
				input.bindings.1 "Input R"
				output.bindings.0 "Output L"
				output.bindings.1 "Output R"
				input.controls [ $WIDTH $SPACE $DIALOG $BASS $AIR $PUNCH ]
			}
		]
		slave.pcm {
			type plug
			slave.pcm {
				type bluealsa
				device $DEV
				profile "a2dp"
			}
		}
	}
	hint.description "Sage soundbar with virtual surround"
}

# The same virtual surround, but for a USB sound card instead of a Bluetooth
# soundbar (the soundbar is now wired to a USB audio card on the Pi). speaker.py
# plays through this when Surround is on and the output is the USB card:
#   aplay -D sage_surround_usb:CARD=Device,WIDTH=0.7,... file.wav
# Chain: any format -> float -> sage_surround (LADSPA) -> plughw:CARD (USB).
pcm.sage_surround_usb {
	@args [ CARD WIDTH SPACE DIALOG BASS AIR PUNCH ]
	@args.CARD { type string default "0" }
	@args.WIDTH { type real default 0.6 }
	@args.SPACE { type real default 0.4 }
	@args.DIALOG { type real default 3 }
	@args.BASS { type real default 3 }
	@args.AIR { type real default 0 }
	@args.PUNCH { type real default 0 }
	type plug
	slave.pcm {
		type ladspa
		path "/usr/local/lib/sage/ladspa"
		channels 2
		plugins [
			{
				label sage_surround
				policy none
				input.bindings.0 "Input L"
				input.bindings.1 "Input R"
				output.bindings.0 "Output L"
				output.bindings.1 "Output R"
				input.controls [ $WIDTH $SPACE $DIALOG $BASS $AIR $PUNCH ]
			}
		]
		slave.pcm {
			type plug
			slave.pcm {
				type hw
				card $CARD
				device 0
			}
		}
	}
	hint.description "Sage USB sound card with virtual surround"
}
