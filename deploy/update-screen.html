<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sage — Updating</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#0a1628;color:#c8d6e5;
}
.logo{width:96px;height:96px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.95)}}
.msg{margin-top:28px;font-size:18px;font-weight:500;letter-spacing:.03em}
.dots::after{content:'';animation:dots 1.5s steps(4,end) infinite}
@keyframes dots{
  0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}
}
.bar-wrap{margin-top:24px;width:200px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar{width:40%;height:100%;border-radius:2px;background:#4f8ef7;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}50%{transform:translateX(150%)}100%{transform:translateX(-100%)}}
.sub{margin-top:16px;font-size:13px;color:#5e6e82}
</style>
</head>
<body>
  <img class="logo" src="/icon-512.png" alt="Sage">
  <div class="msg">Update in progress<span class="dots"></span></div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="sub">Sage will be back in a moment</div>
</body>
</html>
