<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 110px;
      top: var(--content-top, 240px);
      width: 860px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .chart-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 0.92;
      letter-spacing: -0.01em;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 28px;
    }

    .accent-bar {
      width: 80px;
      height: 6px;
      background-color: #EE4425;
      border-radius: 3px;
      margin-bottom: 32px;
    }

    .chart-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 38px;
      line-height: 1.3;
      color: #111111;
      text-align: left;
      margin-bottom: 40px;
    }

    .chart-wrap svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .chart-source {
      position: absolute;
      left: 110px;
      top: calc(var(--footer-y, 1215px) - 64px);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.02em;
      color: #777777;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="topic-pill">{{ brand.tag or 'BUSINESS' }}</div>
  </div>

  <div class="content-container">
    <h2 class="chart-headline">{{ headline }}</h2>
    <div class="accent-bar"></div>
    {% if body %}<p class="chart-body">{{ body }}</p>{% endif %}
    <div class="chart-wrap">{{ chart_svg | safe }}</div>
  </div>

  {% if source_note %}<div class="chart-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="slide-counter">{{ counter }}</div>
  </div>
</body>
</html>
