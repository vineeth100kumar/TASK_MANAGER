<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 110px;
      top: var(--content-top, 260px);
      width: 860px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .stat-headline {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0.08em;
      color: #777777;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 24px;
    }

    .stat-number {
      font-family: 'League Spartan', sans-serif;
      font-weight: 900;
      font-size: 210px;
      line-height: 0.82;
      letter-spacing: -0.03em;
      color: #EE4425;
      text-align: left;
      margin-bottom: 24px;
    }

    .accent-bar {
      width: 80px;
      height: 6px;
      background-color: #000000;
      border-radius: 3px;
      margin-bottom: 40px;
    }

    .stat-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 44px;
      line-height: 1.38;
      letter-spacing: -0.01em;
      color: #111111;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="topic-pill">{{ brand.tag or 'BUSINESS' }}</div>
  </div>

  <div class="content-container">
    {% if headline %}
    <div class="stat-headline">{{ headline }}</div>
    {% endif %}
    <div class="stat-number">{{ number }}</div>
    <div class="accent-bar"></div>
    <p class="stat-body">{{ body }}</p>
  </div>

  {% if source_note %}<div class="slide-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="slide-counter">{{ counter }}</div>
  </div>
</body>
</html>
