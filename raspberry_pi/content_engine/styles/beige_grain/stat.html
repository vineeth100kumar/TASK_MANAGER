<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 112px;
      top: var(--content-top, 260px);
      width: 856px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .stat-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 42px;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: #777777;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 24px;
    }

    .stat-number {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 210px;
      line-height: 0.82;
      letter-spacing: -0.03em;
      color: #000000;
      text-align: left;
      position: relative;
      display: inline-block;
    }

    .stat-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 44px;
      line-height: 1.38;
      letter-spacing: -0.01em;
      color: #0A0A0A;
      text-align: left;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="content-container">
    {% if headline %}
    <div class="stat-headline">{{ headline }}</div>
    {% endif %}
    <div class="stat-number">
      {{ number }}
      {{ underline_svg | safe }}
    </div>
    <p class="stat-body">{{ body }}</p>
  </div>

  {% if source_note %}<div class="slide-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">{{ counter }}</div>
  </div>
</body>
</html>
