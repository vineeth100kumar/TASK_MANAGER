<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 112px;
      top: var(--content-top, 260px);
      width: 856px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .statement-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 140px;
      line-height: 0.9;
      letter-spacing: -0.015em;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .content-container > svg { display: block; margin: 18px 0 30px 0; }

    .statement-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 42px;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: #0A0A0A;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="content-container">
    <h2 class="statement-headline">{{ headline }}</h2>
    {% if body %}
    {{ underline_svg | safe }}
    <p class="statement-body">{{ body }}</p>
    {% endif %}
  </div>

  {% if source_note %}<div class="slide-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">{{ counter }}</div>
  </div>
</body>
</html>
