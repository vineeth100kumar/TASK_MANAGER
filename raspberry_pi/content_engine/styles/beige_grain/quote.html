<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 112px;
      top: var(--content-top, 260px);
      width: 856px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .quote-mark {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 190px;
      line-height: 0.6;
      color: #F86036;
      margin-bottom: 24px;
      user-select: none;
    }

    .quote-body {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 64px;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 40px;
    }

    .quote-author {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.08em;
      color: #F86036;
      text-transform: uppercase;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="content-container">
    <div class="quote-mark">&ldquo;</div>
    <blockquote class="quote-body">{{ body }}</blockquote>
    {% if author %}
    <div class="quote-author">&mdash; {{ author }}</div>
    {% endif %}
  </div>

  {% if source_note %}<div class="slide-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">{{ counter }}</div>
  </div>
</body>
</html>
