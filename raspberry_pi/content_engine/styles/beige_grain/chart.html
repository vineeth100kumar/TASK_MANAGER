<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 112px;
      top: var(--content-top, 260px);
      width: 856px;
      z-index: 5;
    }

    .chart-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 96px;
      line-height: 0.9;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .chart-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 38px;
      line-height: 1.3;
      color: #0A0A0A;
      text-align: left;
      margin: 0 0 40px 0;
    }

    .chart-wrap {
      margin-top: 12px;
    }

    .chart-wrap svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .chart-source {
      position: absolute;
      left: 112px;
      top: calc(var(--footer-y, 1221px) - 64px);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.02em;
      color: #6B6458;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="content-container">
    <h2 class="chart-headline">{{ headline }}</h2>
    {{ underline_svg | safe }}
    {% if body %}<div class="chart-body">{{ body }}</div>{% endif %}
    <div class="chart-wrap">{{ chart_svg | safe }}</div>
  </div>

  {% if source_note %}<div class="chart-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">{{ counter }}</div>
  </div>
</body>
</html>
