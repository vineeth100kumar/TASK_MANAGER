<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .content-container {
      position: absolute;
      left: 112px;
      top: var(--content-top, 260px);
      width: 856px;
      z-index: 5;
    }

    .point-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 100px;
      line-height: 0.9;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .point-body {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 56px;
      line-height: 1.35;
      color: #0A0A0A;
      text-align: left;
      max-width: 856px;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .point-bullets {
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }

    .bullet-row {
      display: flex;
      align-items: flex-start;
      gap: 0.55em;
    }

    .bullet-mark {
      width: 0.42em;
      height: 0.42em;
      border-radius: 2px;
      background-color: #F86036;
      margin-top: 0.5em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="content-container">
    <h2 class="point-headline">{{ headline }}</h2>
    {{ underline_svg | safe }}
    {% if bullets %}
    <div class="point-body point-bullets">
      {% if body %}<div>{{ body }}</div>{% endif %}
      {% for b in bullets %}<div class="bullet-row"><span class="bullet-mark"></span><span>{{ b }}</span></div>{% endfor %}
    </div>
    {% else %}
    <div class="point-body">{{ body }}</div>
    {% endif %}
  </div>

  {% if source_note %}<div class="slide-source">{{ source_note }}</div>{% endif %}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">{{ counter }}</div>
  </div>
</body>
</html>
