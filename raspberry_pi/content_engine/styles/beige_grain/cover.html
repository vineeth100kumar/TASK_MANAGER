<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    {{ base_css | safe }}

    .headline-container {
      position: absolute;
      left: 110px;
      top: var(--cover-top, 394px);
      width: 858px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      z-index: 5;
    }

    .cover-headline {
      font-family: 'League Spartan', sans-serif;
      font-weight: 800;
      font-size: 168px;
      line-height: 0.82;
      letter-spacing: -0.01em;
      color: #000000;
      text-transform: uppercase;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="header-left">{{ brand.page_name }}</div>
    <div class="header-right">{{ brand.tag }}</div>
  </div>

  <div class="headline-container">
    <h1 class="cover-headline">{{ headline }}<span id="baseline-anchor" style="display:inline-block;width:0;height:0;vertical-align:baseline"></span></h1>
  </div>


  {{ underline_svg | safe }}
  {{ loop_svg | safe }}

  <div class="footer-row">
    <div class="footer-left">{{ brand.handle }}</div>
    <div class="footer-right">SWIPE</div>
  </div>
</body>
</html>
