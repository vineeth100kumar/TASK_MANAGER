name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Sage server and LUMO
        run: python -m compileall -q raspberry_pi lumo/rpi_server
      - name: Sage server tests
        working-directory: raspberry_pi
        run: |
          pip install -q pywebpush
          python -m unittest discover -s tests
      - name: LUMO tests
        working-directory: lumo/rpi_server
        run: |
          pip install -q numpy pillow opencv-python-headless
          python -m unittest discover -s tests
