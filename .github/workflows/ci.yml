name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node that built the committed bundle. The bundle check
          # below compares hashed filenames, so a different major here could
          # fail the job over a build difference rather than a source one.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test

      # frontend/dist is committed and nginx serves it straight from the
      # checkout, so a bundle that does not match the source ships an interface
      # nobody wrote. Rebuild and compare.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: The committed bundle must match the source
        run: |
          # --porcelain rather than `git diff`, so a new chunk filename shows
          # up as well: a rebuild renames hashed assets rather than editing
          # them, and untracked files are invisible to `git diff`.
          CHANGES="$(git status --porcelain -- frontend/dist)"
          if [ -n "$CHANGES" ]; then
            echo "::error::frontend/dist is out of date. Run 'npm run build' in frontend/ and commit the result."
            echo "$CHANGES"
            exit 1
          fi
          echo "frontend/dist matches a fresh build."

  secrets:
    name: No secret in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public. The shared secret was committed once, in
      # both the source and the built bundle; this is here so it cannot happen
      # again without someone being told.
      - name: The retired shortcuts secret must stay gone
        run: |
          # Tests and this workflow name the string on purpose, to assert it
          # is refused; anywhere else it is a regression.
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=__tests__ --exclude='ci.yml' \
               --exclude='test_*.py' --exclude='*.test.*' \
               'sage_rpi5_secret_ios_key_2026' .; then
            echo "::error::The retired shared secret is back in the tree."
            exit 1
          fi
          echo "Clean."
